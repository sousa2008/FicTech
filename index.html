<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FicTech - Em Breve | Projeto de Extensão IFSP</title>
    
    <!-- Fonte moderna do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #7B2CBF;
            --primary-light: #9D4EDD;
            --primary-glow: rgba(123, 44, 191, 0.35);
            --bg-dark: #090511;
            --card-bg: rgba(19, 12, 36, 0.75);
            --text-main: #F3F0F9;
            --text-muted: #A39BB0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            /* Gradiente radial de fundo para criar iluminação temática */
            background-image: 
                radial-gradient(circle at 50% 20%, var(--primary-glow) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(60, 9, 108, 0.25) 0%, transparent 40%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(157, 78, 221, 0.25);
            padding: 3rem 2.25rem;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 
                        0 0 30px rgba(123, 44, 191, 0.2);
            text-align: center;
            max-width: 480px;
            width: 100%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 
                        0 0 40px rgba(157, 78, 221, 0.3);
        }

        /* Badge de Status / Projeto */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(123, 44, 191, 0.15);
            border: 1px solid rgba(157, 78, 221, 0.3);
            color: #C77DFF;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        /* Ponto pulsante de status ativo */
        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #00F5D4;
            border-radius: 50%;
            box-shadow: 0 0 10px #00F5D4;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 245, 212, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(0, 245, 212, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 245, 212, 0); }
        }

        .logo-container {
            display: inline-block;
            margin-bottom: 1.5rem;
        }

        .logo {
            width: 130px;
            height: 130px;
            object-fit: contain;
            border-radius: 20px;
            background: #FFFFFF;
            padding: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #FFFFFF 0%, #C77DFF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .description {
            font-size: 0.975rem;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 1.75rem;
        }

        /* Box provocativa "Em breve" */
        .teaser-box {
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--primary-light);
            padding: 1rem 1.25rem;
            border-radius: 0 12px 12px 0;
            text-align: left;
        }

        .teaser-box h2 {
            font-size: 0.875rem;
            color: #E0AAFF;
            margin-bottom: 0.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .teaser-box p {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        footer {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: rgba(163, 155, 176, 0.5);
        }
    </style>
</head>
<body>

    <main class="card">
        <!-- Tag superior de contexto do projeto -->
        <div class="badge">
            <span class="pulse-dot"></span>
            Extensão IFSP • Campus Guarulhos
        </div>

        <div class="logo-container">
            <img src="/img/fictech_logo.jpg" alt="Logo FicTech" class="logo">
        </div>
        
        <h1>FicTech</h1>
        
        <p class="description">
            Conectando inovação tecnológica
        <p class="description">Em breve...</p>
